name: update prices

on:
  schedule:
    - cron: "17 * * * *"   # hourly; off the :00 crowd
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: scrape and write feed
        run: tokenprice --update
      - name: commit if changed
        run: |
          git config user.name "tokenprice-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prices/
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore(prices): $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
