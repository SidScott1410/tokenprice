[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenprice"
version = "0.1.0"
description = "Live token prices across providers, with provenance, as a git-backed feed and a one-call Python API."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Sidney Scott" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
tokenprice = "tokenprice.cli:main"

[project.urls]
Homepage = "https://github.com/SidScott1410/tokenprice"

[tool.setuptools.packages.find]
include = ["tokenprice*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
